<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Anime</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d0f14; color: #e8ecf3; font: 20px/1.4 system-ui, sans-serif; overflow: hidden; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; padding: 28px 40px; }
  .screen.on { display: flex; }
  header { display: flex; align-items: baseline; gap: 20px; margin-bottom: 14px; flex: none; }
  h1 { font-size: 30px; margin: 0; font-weight: 600; }
  .muted { color: #8b95a7; font-size: 16px; }
  input { width: 100%; padding: 14px 18px; font-size: 24px; border-radius: 10px; border: 2px solid #2a3242; background: #151a22; color: inherit; flex: none; }
  input:focus { outline: none; border-color: #4f8cff; }

  .grid { display: grid; gap: 16px; overflow-y: auto; padding: 4px 4px 40px; }
  .cards { grid-template-columns: repeat(6, 1fr); }
  .eps { grid-template-columns: repeat(8, 1fr); align-content: start; }

  .card { background: #151a22; border-radius: 12px; border: 3px solid transparent; padding: 0; color: inherit; text-align: left; overflow: hidden; }
  .card:focus { border-color: #4f8cff; transform: scale(1.04); outline: none; }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1d2430; }
  .card span { display: block; padding: 8px 10px; font-size: 15px; }
  .ep { padding: 16px 6px; font-size: 20px; text-align: center; }
  .ep small { display: block; font-size: 13px; color: #8b95a7; }
  .ep.visto { opacity: .55; }

  #setrow { display: flex; gap: 10px; margin-bottom: 14px; flex: none; }
  #setrow button { padding: 8px 14px; font-size: 16px; border-radius: 8px; border: 2px solid #2a3242; background: #151a22; color: inherit; }
  #setrow button:focus { border-color: #4f8cff; background: #1d2738; outline: none; }

  #kb { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; margin-top: 14px; flex: none; }
  #kb button { padding: 14px 0; font-size: 20px; border-radius: 8px; border: 3px solid #2a3242; background: #151a22; color: inherit; }
  #kb button:focus { border-color: #4f8cff; background: #1d2738; outline: none; }

  #player { padding: 0; background: #000; }
  #player video { width: 100%; height: 100%; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #2a3242; }
  #fill { height: 100%; width: 0; background: #4f8cff; }
  #hud { position: absolute; left: 40px; bottom: 30px; font-size: 22px; text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity .2s; }
  #hud.on { opacity: 1; }
  #msg { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 60px; }
</style>
</head>
<body>

<div id="lib" class="screen on">
  <header><h1>La mia libreria</h1><span class="muted" id="libcount"></span><span class="muted">▲ ▼ cerca · OK apri · Back esci</span></header>
  <div class="grid cards" id="libgrid"></div>
</div>

<div id="search" class="screen">
  <header><h1>Cerca</h1><span class="muted" id="searchinfo">Back per tornare</span></header>
  <input id="q" placeholder="Titolo…" autocomplete="off">
  <div id="kb"></div>
  <div class="grid cards" id="results"></div>
</div>

<div id="series" class="screen">
  <header><h1 id="stitle"></h1><span class="muted" id="sinfo"></span></header>
  <div id="setrow" style="display:none">
    <button id="setRolling"></button>
    <button id="setWindow"></button>
    <button id="setDelete"></button>
  </div>
  <div class="grid eps" id="eps"></div>
</div>

<div id="player" class="screen">
  <video id="video" playsinline></video>
  <div id="bar"><div id="fill"></div></div>
  <div id="hud"></div>
  <div id="msg" class="muted"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, html) => {
  const e = Object.assign(document.createElement(tag), props);
  if (html != null) e.innerHTML = html;
  return e;
};
const api = async (p, opts) => {
  const r = await fetch(p, opts);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
};
const post = (p, body) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
const mb = (b) => (b / 1048576).toFixed(0) + ' MB';

// --- navigazione col telecomando ---
const FOCUSABLE = 'button, input';
const focusables = () => [...document.querySelector('.screen.on').querySelectorAll(FOCUSABLE)].filter((e) => e.offsetParent !== null);
const focusFirst = () => focusables()[0]?.focus();

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === 'OK' || e.key === 'Select') {
    const a = document.activeElement;
    if (a && a.tagName !== 'INPUT') { e.preventDefault(); a.click(); }
    return;
  }
  if (document.querySelector('#player.on')) return; // il player gestisce i tasti da sé

  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const d = dirs[e.key];
  if (!d) return;
  e.preventDefault();

  const list = focusables();
  if (!list.length) return;
  const cur = document.activeElement;
  if (!cur || !list.includes(cur)) return list[0].focus();

  const r0 = cur.getBoundingClientRect();
  const cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
  let best = null, score = Infinity;
  for (const e2 of list) {
    if (e2 === cur) continue;
    const r = e2.getBoundingClientRect();
    const dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy;
    const along = dx * d[0] + dy * d[1];
    if (along <= 0) continue;
    const s = along + Math.abs(dx * d[1] - dy * d[0]) * 3;
    if (s < score) { score = s; best = e2; }
  }
  best?.focus();
});

const show = (id) => document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id));

// --- stato ---
let library = [];
let current = null;     // { slug, title, episodes:[{n,ready,size}], from: 'lib'|'search' }
let jobs = new Map();   // "slug:ep" -> {state,pct}
let backTo = 'lib';

async function loadLibrary() {
  library = await api('/api/library');
  renderLibrary();
  const total = library.reduce((a, s) => a + s.episodes.filter((e) => e.ready).length, 0);
  $('#libcount').textContent = `${library.length} serie · ${total} episodi pronti`;
}

function renderLibrary() {
  const g = $('#libgrid');
  g.innerHTML = '';
  for (const s of library) {
    const ready = s.episodes.filter((e) => e.ready).length;
    const b = el('button', { className: 'card' });
    b.innerHTML = `<img src="${s.poster}" loading="lazy" alt=""><span>${s.title} · ${ready}/${s.episodes.length}</span>`;
    b.onclick = () => openSeries(s.slug);
    g.append(b);
  }
  const add = el('button', { className: 'card ep' });
  add.innerHTML = '＋<small>Cerca e aggiungi</small>';
  add.onclick = openSearch;
  g.prepend(add);
  if (!library.length) g.append(el('div', { className: 'muted' }, 'Nessuna serie: premi ＋ per cercarne una.'));
}

// --- ricerca ---
const kb = $('#kb');
for (const k of [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ', ...'0123456789', '⌫', 'Cerca']) {
  const b = el('button', {}, k);
  b.onclick = () => {
    if (k === '⌫') $('#q').value = $('#q').value.slice(0, -1);
    else if (k === 'Cerca') doSearch();
    else $('#q').value += k;
  };
  kb.append(b);
}
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

function openSearch() {
  backTo = document.querySelector('.screen.on').id;
  show('search');
  $('#q').focus();
}

let seq = 0;
async function doSearch() {
  const q = $('#q').value.trim();
  if (!q) return;
  const my = ++seq;
  $('#results').innerHTML = '<div class="muted">Cerco…</div>';
  try {
    const items = await api('/api/search?q=' + encodeURIComponent(q));
    if (my !== seq) return;
    const g = $('#results');
    g.innerHTML = '';
    for (const it of items) {
      const b = el('button', { className: 'card' });
      b.innerHTML = `<img src="${it.poster}" loading="lazy" alt=""><span>${it.title}</span>`;
      b.onclick = () => openSeries(it.slug, it);
      g.append(b);
    }
    if (!items.length) g.append(el('div', { className: 'muted' }, 'Nessun risultato'));
    g.scrollTop = 0;
  } catch (e) {
    $('#results').innerHTML = `<div class="muted">Errore: ${e.message}</div>`;
  }
}

// --- serie ---
async function openSeries(slug, hint) {
  current = {
    slug, title: hint?.title || '…', episodes: [], from: document.querySelector('.screen.on').id,
    meta: null, watched: new Set(),
  };
  $('#stitle').textContent = current.title;
  $('#sinfo').textContent = 'carico…';
  $('#eps').innerHTML = '';
  show('series');
  try {
    const local = library.find((s) => s.slug === slug);
    // lista episodi sempre dal sito: così si possono aggiungere anche le puntate nuove
    const s = await api('/api/series?slug=' + encodeURIComponent(slug)).catch(() => null);
    const readyMap = new Map((local?.episodes || []).map((e) => [e.n, e]));
    const list = s ? s.episodes : [...readyMap.keys()];
    current.title = s?.title || local?.title || current.title;
    current.episodes = list.map((n) => readyMap.get(n) || { n, ready: false, size: 0 });
    applyLocal(local);
    renderSeries();
    focusFirst();
  } catch (e) {
    $('#sinfo').textContent = 'Errore: ' + e.message;
  }
}

// trapianta nella vista corrente stato e impostazioni della serie presi dalla libreria
function applyLocal(local) {
  if (!local) return;
  current.meta = { rolling: local.rolling, window: local.window, deleteWatched: local.deleteWatched };
  current.watched = new Set(local.watched || []);
  const readyMap = new Map(local.episodes.map((e) => [e.n, e]));
  current.episodes = current.episodes.map((e) => readyMap.get(e.n) || { n: e.n, ready: false, size: 0 });
}

function epLabel(ep) {
  const j = jobs.get(`${current.slug}:${ep.n}`);
  const visto = current.watched.has(ep.n);
  const mark = visto ? '✓ ' : '';
  if (ep.ready) return `${mark}Ep ${ep.n}<small>${mb(ep.size)}</small>`;
  if (j?.state === 'running') return `Ep ${ep.n}<small>${j.pct}%</small>`;
  if (j?.state === 'queued') return `Ep ${ep.n}<small>in coda</small>`;
  if (j?.state === 'error') return `Ep ${ep.n}<small>errore</small>`;
  return `${mark}Ep ${ep.n}<small>${visto ? 'riscarica ⬇' : 'scarica ⬇'}</small>`;
}

function renderSeries() {
  if (!current) return;
  const focused = document.activeElement?.dataset?.ep;
  $('#stitle').textContent = current.title;
  const ready = current.episodes.filter((e) => e.ready).length;
  const next = current.episodes.find((e) => !current.watched.has(e.n));
  $('#sinfo').textContent = `${ready}/${current.episodes.length} pronti · prossimo: ${next ? 'Ep ' + next.n : 'fine'} · Back indietro`;

  const m = current.meta;
  $('#setrow').style.display = m ? 'flex' : 'none';
  if (m) {
    $('#setRolling').textContent = `Marching: ${m.rolling ? 'on' : 'off'}`;
    $('#setWindow').textContent = `Finestra: ${m.window}`;
    $('#setDelete').textContent = `Elimina viste: ${m.deleteWatched ? 'sì' : 'no'}`;
  }

  const g = $('#eps');
  g.innerHTML = '';
  for (const ep of current.episodes) {
    const b = el('button', { className: 'card ep' + (current.watched.has(ep.n) ? ' visto' : ''), innerHTML: epLabel(ep) });
    b.dataset.ep = ep.n;
    b.onclick = () => (ep.ready ? play(current.slug, ep.n) : download(current.slug, ep.n));
    g.append(b);
  }
  if (focused) $(`[data-ep="${focused}"]`)?.focus();
}

const WINDOWS = [1, 2, 5, 10, 15, 20, 30, 50];

async function saveSettings(patch) {
  try {
    const r = await post('/api/settings', { slug: current.slug, ...patch });
    current.meta = { rolling: r.series.rolling, window: r.series.window, deleteWatched: r.series.deleteWatched };
    renderSeries();
    if (r.queued) poll();
  } catch (e) {
    $('#sinfo').textContent = 'Errore: ' + e.message;
  }
}

$('#setRolling').onclick = () => current?.meta && saveSettings({ rolling: !current.meta.rolling });
$('#setDelete').onclick = () => current?.meta && saveSettings({ deleteWatched: !current.meta.deleteWatched });
$('#setWindow').onclick = () => {
  if (!current?.meta) return;
  const i = WINDOWS.indexOf(current.meta.window);
  saveSettings({ window: WINDOWS[(i + 1) % WINDOWS.length] });
};

async function download(slug, ep) {
  try {
    await post('/api/download', { slug, ep });
    jobs.set(`${slug}:${ep}`, { state: 'queued', pct: 0 });
    await loadLibrary();
    applyLocal(library.find((s) => s.slug === slug));
    renderSeries();
    poll();
  } catch (e) {
    $('#sinfo').textContent = 'Errore: ' + e.message;
  }
}

// --- coda ---
let polling = null;
let queueSig = '';
async function poll() {
  if (polling) return;
  polling = setInterval(async () => {
    try {
      const q = await api('/api/queue');
      jobs = new Map(q.map((j) => [j.key, j]));
      const sig = q.map((j) => `${j.key}:${j.state}:${j.pct}`).join('|');
      if (sig === queueSig) return;
      queueSig = sig;
      if (document.querySelector('#series.on')) renderSeries();
      if (q.some((j) => j.state === 'done')) {
        await loadLibrary();
        if (document.querySelector('#series.on') && current) {
          applyLocal(library.find((s) => s.slug === current.slug));
          renderSeries();
        }
      }
    } catch { /* rete momentanea */ }
  }, 2000);
}

// --- player ---
let playing = null;
function play(slug, ep) {
  const v = $('#video');
  const msg = $('#msg');
  msg.style.display = 'none';
  playing = { slug, ep };
  v.src = `/media/${slug}/ep-${ep}.mp4`;
  v.play().catch(() => {});
  v.focus();
  show('player');
}

const fmt = (s) => Number.isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '--:--';

document.addEventListener('keydown', (e) => {
  if (!document.querySelector('#player.on')) return;
  const v = $('#video');
  const hud = $('#hud');

  if (e.key === 'Backspace' || e.key === 'Escape' || e.key === 'GoBack') {
    v.pause();
    show('series');
    renderSeries();
    focusFirst();
    return;
  }
  if (e.key === 'Enter' || e.key === 'OK' || e.key === 'Select') {
    e.preventDefault();
    v.paused ? v.play() : v.pause();
  } else if (e.key === 'ArrowLeft') {
    v.currentTime = Math.max(0, v.currentTime - 10);
  } else if (e.key === 'ArrowRight') {
    v.currentTime += 10;
  } else {
    return;
  }
  hud.textContent = `${v.paused ? '⏸' : '▶'} ${fmt(v.currentTime)} / ${fmt(v.duration)}`;
  hud.classList.add('on');
  clearTimeout(hud._t);
  hud._t = setTimeout(() => hud.classList.remove('on'), 2000);
});

$('#video').addEventListener('timeupdate', (e) => {
  const v = e.target;
  $('#fill').style.width = (v.duration ? (v.currentTime / v.duration) * 100 : 0) + '%';
});
$('#video').addEventListener('error', () => {
  const m = $('#msg');
  m.textContent = 'Impossibile riprodurre il file (download incompleto?)';
  m.style.display = 'grid';
});

// fine episodio: il server segna vista, sposta la finestra e (se attivo) cancella il file
$('#video').addEventListener('ended', async () => {
  const done = playing;
  playing = null;
  if (!done) return;
  try {
    await post('/api/watched', { slug: done.slug, ep: done.ep });
  } catch (e) {
    $('#sinfo').textContent = 'Errore: ' + e.message;
  }
  await loadLibrary().catch(() => {});
  if (current && current.slug === done.slug) {
    applyLocal(library.find((s) => s.slug === done.slug));
    show('series');
    renderSeries();
  } else {
    show('lib');
  }
  setTimeout(focusFirst, 0);
  poll();
});

// Back sulle schermate
document.addEventListener('keydown', (e) => {
  if (document.querySelector('#player.on')) return;
  if (e.key !== 'Backspace' && e.key !== 'Escape' && e.key !== 'GoBack') return;
  const cur = document.querySelector('.screen.on').id;
  if (cur === 'search' || cur === 'series') {
    e.preventDefault();
    if (cur === 'series') { show(backTo === 'search' ? 'search' : 'lib'); if (backTo !== 'search') loadLibrary(); }
    else { show('lib'); loadLibrary(); }
    setTimeout(focusFirst, 0);
  } else {
    window.close(); // VIDAA: il Back in home deve chiudere l'app
  }
});

loadLibrary().then(focusFirst).catch((e) => {
  $('#libgrid').innerHTML = `<div class="muted">Errore: ${e.message}</div>`;
});
poll();
</script>
</body>
</html>
