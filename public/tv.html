<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Anime</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d0f14; color: #e8ecf3; font: 20px/1.4 system-ui, sans-serif; overflow: hidden; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; padding: 28px 40px; }
  .screen.on { display: flex; }
  header { display: flex; align-items: baseline; gap: 20px; margin-bottom: 14px; flex: none; }
  h1 { font-size: 30px; margin: 0; font-weight: 600; }
  .muted { color: #8b95a7; font-size: 16px; }
  input { width: 100%; padding: 14px 18px; font-size: 24px; border-radius: 10px; border: 2px solid #2a3242; background: #151a22; color: inherit; flex: none; }
  input:focus { outline: none; border-color: #4f8cff; }

  .grid { display: grid; gap: 16px; overflow-y: auto; padding: 4px 4px 40px; }
  /* righe alla loro altezza naturale: senza questo la griglia comprime le card
     e overflow:hidden taglia il titolo sotto la copertina */
  .cards { grid-template-columns: repeat(6, 1fr); grid-auto-rows: max-content; align-content: start; }
  .eps { grid-template-columns: repeat(8, 1fr); align-content: start; }

  .card { background: #151a22; border-radius: 12px; border: 3px solid transparent; padding: 0; color: inherit; text-align: left; overflow: hidden; }
  .card:focus { border-color: #4f8cff; transform: scale(1.04); outline: none; }
  .card img { width: 100%; aspect-ratio: 2/3; max-height: 34vh; object-fit: cover; display: block; background: #1d2430; }
  .card span { display: block; padding: 8px 10px; font-size: 15px; }
  .ep { padding: 16px 6px; font-size: 20px; text-align: center; }
  .ep small { display: block; font-size: 13px; color: #8b95a7; }
  .ep.visto { opacity: .55; }

  #setrow { display: flex; gap: 10px; margin-bottom: 14px; flex: none; }
  #setrow button { padding: 8px 14px; font-size: 16px; border-radius: 8px; border: 2px solid #2a3242; background: #151a22; color: inherit; }
  #setrow button:focus { border-color: #4f8cff; background: #1d2738; outline: none; }

  #ask { display: none; gap: 12px; margin-bottom: 14px; flex: none; }
  #ask button { padding: 12px 18px; font-size: 18px; border-radius: 8px; border: 3px solid #2a3242; background: #151a22; color: inherit; }
  #ask button:focus { border-color: #4f8cff; background: #1d2738; outline: none; }

  .hbtn { padding: 6px 12px; font-size: 15px; border-radius: 8px; border: 2px solid #2a3242; background: #151a22; color: inherit; }
  .hbtn:focus { border-color: #4f8cff; background: #1d2738; outline: none; }

  /* tastiera compatta: sta su 3 righe e si nasconde quando arrivano i risultati */
  #kb { display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px; margin-top: 10px; flex: none; }
  #kb.off { display: none; }
  #kb button { padding: 8px 0; font-size: 17px; border-radius: 6px; border: 2px solid #2a3242; background: #151a22; color: inherit; }
  #kb button:focus { border-color: #4f8cff; background: #1d2738; outline: none; }
  #results { flex: 1; min-height: 0; }

  #player { padding: 0; background: #000; outline: none; }
  #player video { width: 100%; height: 100%; }
  /* indicatore di riproduzione: barra e/o tempo, angolo e colore da /config */
  #prog { position: absolute; display: flex; flex-direction: column; gap: 6px; width: 34%; z-index: 3; }
  #prog.tl { top: 22px; left: 32px; }
  #prog.tr { top: 22px; right: 32px; align-items: flex-end; }
  #prog.bl { bottom: 30px; left: 32px; }
  #prog.br { bottom: 30px; right: 32px; align-items: flex-end; }
  #prog[data-mode="bar"] #ptime { display: none; }
  #prog[data-mode="time"] #bar { display: none; }
  #bar { width: 100%; height: 6px; background: rgba(42,50,66,.75); border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #4f8cff; }
  #ptime { font-size: 20px; font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px #000; }

  /* indietro in alto a destra su tutte le schermate (nel player c e gia Esci) */
  #backbtn { position: absolute; top: 14px; right: 24px; z-index: 5; padding: 10px 16px; font-size: 18px;
    border-radius: 8px; border: 2px solid #4a566c; background: rgba(21,26,34,.82); color: inherit; }
  #backbtn:focus { border-color: #4f8cff; background: #1d2738; outline: none; }
  .hbtn { padding: 6px 14px; font-size: 16px; border-radius: 8px; border: 2px solid #2a3242; background: #151a22; color: inherit; }
  .hbtn:focus { border-color: #4f8cff; background: #1d2738; outline: none; }
  #hud { position: absolute; left: 40px; right: 40px; bottom: 90px; font-size: 22px; text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity .2s; }
  #hud.on { opacity: 1; }
  #msg { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 60px; }
  /* bottoni del player: il telecomando muove un cursore, quindi si possono cliccare */
  #pctl { position: absolute; top: 16px; right: 24px; display: flex; gap: 10px; opacity: 1; transition: opacity .2s; }
  #pctl.off { opacity: 0; visibility: hidden; pointer-events: none; }
  #pctl button { padding: 10px 16px; font-size: 18px; border-radius: 8px; border: 2px solid #4a566c; background: rgba(21, 26, 34, .82); color: inherit; }
  #pctl button:focus { border-color: #4f8cff; background: #1d2738; outline: none; }
</style>
</head>
<body>

<button id="backbtn">← Indietro</button>

<div id="lib" class="screen on">
  <header><h1>La mia libreria</h1><span class="muted" id="libcount"></span><button class="hbtn" id="newsbtn">Novità</button><span class="muted">▲ ▼ cerca · OK apri · Back esci</span></header>
  <div class="grid cards" id="libgrid"></div>
</div>

<div id="search" class="screen">
  <header>
    <h1>Cerca</h1><span class="muted" id="searchinfo">Back per tornare</span>
    <button id="kbToggle" class="hbtn">Nascondi tastiera</button>
    <button id="kbPin" class="hbtn">Tastiera auto: sì</button>
  </header>
  <input id="q" placeholder="Titolo…" autocomplete="off">
  <div id="kb" class="off"></div>
  <div class="grid cards" id="results"></div>
</div>

<div id="series" class="screen">
  <header><h1 id="stitle"></h1><span class="muted" id="sinfo"></span></header>
  <div id="setrow" style="display:none">
    <button id="setRolling"></button>
    <button id="setWindow"></button>
    <button id="setDelete"></button>
  </div>
  <div id="ask">
    <button id="askLive">Guarda in streaming</button>
    <button id="askDownload">Scarica</button>
    <button id="askCancel">Annulla</button>
  </div>
  <div class="grid eps" id="eps"></div>
</div>

<div id="player" class="screen" tabindex="-1">
  <video id="video" playsinline controls></video>
  <div id="prog" class="bl" data-mode="bar">
    <div id="bar"><div id="fill"></div></div>
    <div id="ptime">0:00 / 0:00</div>
  </div>
  <div id="pctl">
    <button id="pnext">Prossimo episodio ▶</button>
    <button id="pexit">Esci ✕</button>
  </div>
  <div id="hud"></div>
  <div id="msg" class="muted"></div>
</div>

<!-- hls.js vendorizzato: Chromium su VIDAA non ha HLS nativo e la TV può non avere internet -->
<script src="/hls.js"></script>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, html) => {
  const e = Object.assign(document.createElement(tag), props);
  if (html != null) e.innerHTML = html;
  return e;
};
const api = async (p, opts) => {
  const r = await fetch(p, opts);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
};
const post = (p, body) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
const mb = (b) => (b / 1048576).toFixed(0) + ' MB';

// --- navigazione col telecomando ---
const FOCUSABLE = 'button, input';
const focusables = () => {
  const lista = [...document.querySelector('.screen.on').querySelectorAll(FOCUSABLE)];
  const back = document.querySelector('#backbtn');
  if (back && back.offsetParent !== null) lista.push(back);
  return lista.filter((e) => e.offsetParent !== null && !e.closest('#pctl.off'));
};
const focusFirst = () => focusables()[0]?.focus();

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === 'OK' || e.key === 'Select') {
    const a = document.activeElement;
    if (a && a.tagName !== 'INPUT') { e.preventDefault(); a.click(); }
    return;
  }
  if (document.querySelector('#player.on')) return; // il player gestisce i tasti da sé

  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const d = dirs[e.key];
  if (!d) return;
  e.preventDefault();

  const list = focusables();
  if (!list.length) return;
  const cur = document.activeElement;
  if (!cur || !list.includes(cur)) return list[0].focus();

  const r0 = cur.getBoundingClientRect();
  const cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
  let best = null, score = Infinity;
  for (const e2 of list) {
    if (e2 === cur) continue;
    const r = e2.getBoundingClientRect();
    const dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy;
    const along = dx * d[0] + dy * d[1];
    if (along <= 0) continue;
    const s = along + Math.abs(dx * d[1] - dy * d[0]) * 3;
    if (s < score) { score = s; best = e2; }
  }
  best?.focus();
});

const show = (id) => {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id));
  document.querySelector('#backbtn').style.display = id === 'player' ? 'none' : '';
};

// --- stato ---
let library = [];
let current = null;     // { slug, title, episodes:[{n,ready,size,pos}], from: 'lib'|'search' }
let jobs = new Map();   // "slug:ep" -> {state,pct}
let backTo = 'lib';

async function loadLibrary() {
  library = await api('/api/library');
  renderLibrary();
  const total = library.reduce((a, s) => a + s.episodes.filter((e) => e.ready).length, 0);
  $('#libcount').textContent = `${library.length} serie · ${total} episodi pronti`;
}

function renderLibrary() {
  const g = $('#libgrid');
  g.innerHTML = '';
  for (const s of library) {
    const ready = s.episodes.filter((e) => e.ready).length;
    const b = el('button', { className: 'card' });
    b.innerHTML = `<img src="${s.poster}" loading="lazy" alt=""><span>${s.title} · ${ready}/${s.episodes.length}</span>`;
    b.onclick = () => openSeries(s.slug);
    g.append(b);
  }
  const add = el('button', { className: 'card ep' });
  add.innerHTML = '＋<small>Cerca e aggiungi</small>';
  add.onclick = openSearch;
  g.prepend(add);
  if (!library.length) g.append(el('div', { className: 'muted' }, 'Nessuna serie: premi ＋ per cercarne una.'));
}

// --- ricerca ---
const kb = $('#kb');
for (const k of [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ', ...'0123456789', '⌫', 'Cerca']) {
  const b = el('button', {}, k);
  b.onclick = () => {
    if (k === '⌫') $('#q').value = $('#q').value.slice(0, -1);
    else if (k === 'Cerca') doSearch();
    else $('#q').value += k;
  };
  kb.append(b);
}
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

// --- tastiera su schermo: compatta, si nasconde da sola e si può bloccare ---
const KB_AUTO = 'vidaa.kb.auto';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage negato: vale per la sessione */ } },
};
let kbAuto = store.get(KB_AUTO) !== 'off';

function showKb(on) {
  $('#kb').classList.toggle('off', !on);
  $('#kbToggle').textContent = on ? 'Nascondi tastiera' : 'Mostra tastiera';
}

function setKbAuto(on) {
  kbAuto = on;
  store.set(KB_AUTO, on ? 'on' : 'off');
  $('#kbPin').textContent = `Tastiera auto: ${on ? 'sì' : 'no'}`;
}

$('#kbToggle').onclick = () => showKb($('#kb').classList.contains('off'));
$('#kbPin').onclick = () => { setKbAuto(!kbAuto); if (!kbAuto) showKb(false); };
setKbAuto(kbAuto);
showKb(false);

function openSearch() {
  backTo = document.querySelector('.screen.on').id;
  show('search');
  showKb(kbAuto);
  (kbAuto ? $('#q') : $('#kbToggle')).focus();
}

let seq = 0;
async function doSearch() {
  const q = $('#q').value.trim();
  if (!q) return;
  const my = ++seq;
  showKb(false); // i risultati prendono lo spazio della tastiera
  $('#results').innerHTML = '<div class="muted">Cerco…</div>';
  try {
    const items = await api('/api/search?q=' + encodeURIComponent(q));
    if (my !== seq) return;
    const g = $('#results');
    g.innerHTML = '';
    for (const it of items) {
      const b = el('button', { className: 'card' });
      b.innerHTML = `<img src="${it.poster}" loading="lazy" alt=""><span>${it.title}</span>`;
      b.onclick = () => openSeries(it.slug, it);
      g.append(b);
    }
    if (!items.length) g.append(el('div', { className: 'muted' }, 'Nessun risultato'));
    g.scrollTop = 0;
    (g.querySelector('.card') || $('#kbToggle')).focus();
  } catch (e) {
    $('#results').innerHTML = `<div class="muted">Errore: ${e.message}</div>`;
  }
}

// --- serie ---
async function openSeries(slug, hint) {
  current = {
    slug, title: hint?.title || '…', episodes: [], from: document.querySelector('.screen.on').id,
    meta: null, watched: new Set(),
  };
  $('#stitle').textContent = current.title;
  $('#sinfo').textContent = 'carico…';
  $('#eps').innerHTML = '';
  show('series');
  try {
    const local = library.find((s) => s.slug === slug);
    // lista episodi sempre dal sito: così si possono aggiungere anche le puntate nuove
    const s = await api('/api/series?slug=' + encodeURIComponent(slug)).catch(() => null);
    const readyMap = new Map((local?.episodes || []).map((e) => [e.n, e]));
    const list = s ? s.episodes : [...readyMap.keys()];
    current.title = s?.title || local?.title || current.title;
    current.episodes = list.map((n) => readyMap.get(n) || { n, ready: false, size: 0 });
    applyLocal(local);
    renderSeries();
    focusFirst();
  } catch (e) {
    $('#sinfo').textContent = 'Errore: ' + e.message;
  }
}

// trapianta nella vista corrente stato e impostazioni della serie presi dalla libreria
function applyLocal(local) {
  if (!local) return;
  current.meta = { rolling: local.rolling, window: local.window, deleteWatched: local.deleteWatched };
  current.watched = new Set(local.watched || []);
  const readyMap = new Map(local.episodes.map((e) => [e.n, e]));
  current.episodes = current.episodes.map((e) => readyMap.get(e.n) || { n: e.n, ready: false, size: 0 });
}

function epLabel(ep) {
  const j = jobs.get(`${current.slug}:${ep.n}`);
  const visto = current.watched.has(ep.n);
  const mark = visto ? '✓ ' : '';
  // minutaggio salvato: dice da dove riparte il player
  const pos = ep.pos > 0 ? ` · ${fmt(ep.pos)}` : '';
  if (ep.ready) return `${mark}Ep ${ep.n}<small>${mb(ep.size)}${pos}</small>`;
  if (j?.state === 'running') return `Ep ${ep.n}<small>${j.pct}%</small>`;
  if (j?.state === 'queued') return `Ep ${ep.n}<small>in coda</small>`;
  if (j?.state === 'error') return `Ep ${ep.n}<small>errore</small>`;
  return `${mark}Ep ${ep.n}<small>${visto ? 'riscarica ⬇' : 'scarica ⬇'}</small>`;
}

function renderSeries() {
  if (!current) return;
  const focused = document.activeElement?.dataset?.ep;
  $('#stitle').textContent = current.title;
  const ready = current.episodes.filter((e) => e.ready).length;
  const next = current.episodes.find((e) => !current.watched.has(e.n));
  $('#sinfo').textContent = `${ready}/${current.episodes.length} pronti · prossimo: ${next ? 'Ep ' + next.n : 'fine'} · Back indietro`;

  const m = current.meta;
  $('#setrow').style.display = m ? 'flex' : 'none';
  if (m) {
    $('#setRolling').textContent = `Marching: ${m.rolling ? 'on' : 'off'}`;
    $('#setWindow').textContent = `Finestra: ${m.window}`;
    $('#setDelete').textContent = `Elimina viste: ${m.deleteWatched ? 'sì' : 'no'}`;
  }

  const g = $('#eps');
  g.innerHTML = '';
  for (const ep of current.episodes) {
    const b = el('button', { className: 'card ep' + (current.watched.has(ep.n) ? ' visto' : ''), innerHTML: epLabel(ep) });
    b.dataset.ep = ep.n;
    b.onclick = () => (ep.ready ? play(current.slug, ep.n) : askEpisode(ep.n));
    g.append(b);
  }
  if (focused) $(`[data-ep="${focused}"]`)?.focus();
}

// episodio non pronto: streaming o download, scelti col telecomando
let askEp = null;
function askEpisode(n) {
  askEp = n;
  $('#ask').style.display = 'flex';
  $('#askLive').focus();
}

function closeAsk() {
  $('#ask').style.display = 'none';
  const n = askEp;
  askEp = null;
  $(`[data-ep="${n}"]`)?.focus();
}

$('#askLive').onclick = () => {
  const n = askEp;
  closeAsk();
  playLive(current.slug, n);
};
$('#askDownload').onclick = () => {
  const n = askEp;
  closeAsk();
  download(current.slug, n);
};
$('#askCancel').onclick = closeAsk;

const WINDOWS = [1, 2, 5, 10, 15, 20, 30, 50];

async function saveSettings(patch) {
  try {
    const r = await post('/api/settings', { slug: current.slug, ...patch });
    current.meta = { rolling: r.series.rolling, window: r.series.window, deleteWatched: r.series.deleteWatched };
    renderSeries();
    if (r.queued) poll();
  } catch (e) {
    $('#sinfo').textContent = 'Errore: ' + e.message;
  }
}

$('#setRolling').onclick = () => current?.meta && saveSettings({ rolling: !current.meta.rolling });
$('#setDelete').onclick = () => current?.meta && saveSettings({ deleteWatched: !current.meta.deleteWatched });
$('#setWindow').onclick = () => {
  if (!current?.meta) return;
  const i = WINDOWS.indexOf(current.meta.window);
  saveSettings({ window: WINDOWS[(i + 1) % WINDOWS.length] });
};

async function download(slug, ep) {
  try {
    await post('/api/download', { slug, ep });
    jobs.set(`${slug}:${ep}`, { state: 'queued', pct: 0 });
    await loadLibrary();
    applyLocal(library.find((s) => s.slug === slug));
    renderSeries();
    poll();
  } catch (e) {
    $('#sinfo').textContent = 'Errore: ' + e.message;
  }
}

// --- coda ---
let polling = null;
let queueSig = '';
async function poll() {
  if (polling) return;
  polling = setInterval(async () => {
    try {
      const q = await api('/api/queue');
      jobs = new Map(q.map((j) => [j.key, j]));
      const sig = q.map((j) => `${j.key}:${j.state}:${j.pct}`).join('|');
      if (sig === queueSig) return;
      queueSig = sig;
      if (document.querySelector('#series.on')) renderSeries();
      if (q.some((j) => j.state === 'done')) {
        await loadLibrary();
        if (document.querySelector('#series.on') && current) {
          applyLocal(library.find((s) => s.slug === current.slug));
          renderSeries();
        }
      }
    } catch { /* rete momentanea */ }
  }, 2000);
}

// --- player ---
// playing.local: file su disco (resume + progress). live: proxy HLS/mp4, niente slot occupati.
let playing = null;
let hls = null;
let progressTimer = null;

const fmt = (s) => Number.isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '--:--';

function flashHud(text) {
  const hud = $('#hud');
  hud.textContent = text;
  hud.classList.add('on');
  clearTimeout(hud._t);
  hud._t = setTimeout(() => hud.classList.remove('on'), 2500);
}

// controlli a schermo: compaiono a ogni tasto, così il telecomando si spiega da sé
const OSD_HINT = 'OK pausa · ◀ ▶ o giallo/verde 10 s · blu prossimo · rosso indietro';
function showOsd(extra = '') {
  const v = $('#video');
  flashHud(`${v.paused ? '⏸' : '▶'} ${fmt(v.currentTime)} / ${fmt(v.duration)}${extra ? ' · ' + extra : ''}   —   ${OSD_HINT}`);
}

// VIDAA/Tizen/WebOS non concordano sul nome del tasto indietro: si accettano tutti
const BACK_KEYS = ['Backspace', 'Escape', 'GoBack', 'BrowserBack', 'Back', 'Exit'];

// tasti colorati: il telecomando VIDAA li manda come keyCode 403-406, alcuni browser
// con i nomi ColorF0Red/ColorF1Green/ColorF2Yellow/ColorF3Blue. Rosso = indietro
const COLOR_BY_CODE = { 403: 'red', 404: 'green', 405: 'yellow', 406: 'blue' };
const COLOR_BY_NAME = {
  ColorF0Red: 'red', ColorF1Green: 'green', ColorF2Yellow: 'yellow', ColorF3Blue: 'blue',
  Red: 'red', Green: 'green', Yellow: 'yellow', Blue: 'blue',
};
const colorOf = (e) => COLOR_BY_NAME[e.key] || COLOR_BY_CODE[e.keyCode] || null;

const isBack = (e) =>
  BACK_KEYS.includes(e.key) || [4, 8, 27, 461, 10009].includes(e.keyCode) || colorOf(e) === 'red';

function stopLive() {
  if (hls) { hls.destroy(); hls = null; }
}

// bottoni del player: visibili per 5 s, poi tornano appena si preme un tasto
function showCtl() {
  const box = $('#pctl');
  box.classList.remove('off');
  clearTimeout(showCtl._t);
  showCtl._t = setTimeout(() => {
    box.classList.add('off');
    if (box.contains(document.activeElement)) $('#player').focus();
  }, 5000);
}

function stopProgress() {
  if (progressTimer) clearInterval(progressTimer);
  progressTimer = null;
}

async function saveProgress() {
  const v = $('#video');
  if (!playing || !Number.isFinite(v.duration) || v.duration <= 0) return;
  try {
    await post('/api/progress', { slug: playing.slug, ep: playing.ep, pos: v.currentTime, dur: v.duration });
  } catch { /* rete momentanea: si riprova al prossimo giro */ }
}

function startProgress() {
  stopProgress();
  progressTimer = setInterval(saveProgress, 10000);
}

function play(slug, ep) {
  const v = $('#video');
  stopLive();
  $('#msg').style.display = 'none';
  playing = { slug, ep, local: true };
  v.src = `/media/${slug}/ep-${ep}.mp4`;
  v.play().catch(() => {});
  show('player');
  $('#player').focus();
  startProgress();
  showOsd();
  showCtl();
}

async function playLive(slug, ep) {
  const v = $('#video');
  const msg = $('#msg');
  try {
    const live = await api(`/api/live?slug=${encodeURIComponent(slug)}&ep=${ep}`);
    stopLive();
    stopProgress();
    msg.style.display = 'none';
    v.removeAttribute('src');
    v.load();
    playing = { slug, ep, local: false };
    if (live.kind === 'hls' && window.Hls?.isSupported()) {
      hls = new window.Hls();
      hls.loadSource(live.src);
      hls.attachMedia(v);
      hls.on(window.Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        msg.textContent = `Streaming interrotto (${d.details})`;
        msg.style.display = 'grid';
      });
    } else {
      v.src = live.src; // mp4 diretto dal proxy, o HLS nativo se hls.js non c'è
    }
    v.play().catch(() => {});
    show('player');
    $('#player').focus();
    showOsd();
    showCtl();
  } catch (e) {
    $('#sinfo').textContent = 'Streaming non disponibile: ' + e.message;
  }
}

// ripresa: solo sui file locali, e non negli ultimi 60 s
$('#video').addEventListener('loadedmetadata', (e) => {
  if (e.target !== $('#video')) return;
  if (document.querySelector('#player.on')) showOsd();
  if (!playing?.local) return;
  const row = current?.slug === playing.slug && current.episodes.find((x) => x.n === playing.ep);
  const pos = row?.pos || 0;
  const v = $('#video');
  if (pos > 30 && Number.isFinite(v.duration) && pos < v.duration - 60) {
    v.currentTime = pos;
    flashHud(`Riprendo da ${fmt(pos)}`);
  }
});

$('#video').addEventListener('play', () => { if (document.querySelector('#player.on')) showOsd(); });
$('#video').addEventListener('pause', () => { if (document.querySelector('#player.on')) showOsd(); });

// uscita dal player: ultimo progress, flusso chiuso, si torna agli episodi
function exitPlayer() {
  const v = $('#video');
  clearTimeout(showCtl._t);
  void saveProgress();
  stopProgress();
  stopLive();
  v.pause();
  show('series');
  renderSeries();
  focusFirst();
}

// prossimo episodio: file locale se c'è, altrimenti streaming
function nextEpisode() {
  if (!playing) return;
  const { slug, ep } = playing;
  const next = (current?.slug === slug ? current.episodes : []).find((x) => x.n > ep);
  if (!next) return flashHud('Ultimo episodio disponibile');
  if (next.ready) play(slug, next.n);
  else playLive(slug, next.n);
}

$('#pnext').onclick = nextEpisode;
$('#pexit').onclick = exitPlayer;

// alcuni browser TV consegnano il Back solo su keyup: doppia rete di sicurezza
window.addEventListener('keyup', (e) => {
  if (!document.querySelector('#player.on') || !isBack(e)) return;
  e.preventDefault();
  exitPlayer();
}, true);

document.addEventListener('keydown', (e) => {
  if (!document.querySelector('#player.on')) return;
  const v = $('#video');

  if (isBack(e)) {
    e.preventDefault();
    e.stopPropagation();
    exitPlayer();
    return;
  }
  const colore = colorOf(e);
  if (colore === 'yellow' || colore === 'green') {
    e.preventDefault();
    v.currentTime = Math.max(0, v.currentTime + (colore === 'green' ? 10 : -10));
    showOsd(colore === 'green' ? '+10 s' : '−10 s');
    showCtl();
    return;
  }
  if (colore === 'blue') {
    e.preventDefault();
    nextEpisode();
    return;
  }
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'OK' || e.key === 'Select') {
    // se il focus è su un bottone del player il primo gestore ha già cliccato:
    // qui non si deve anche mettere in pausa
    if (document.activeElement?.tagName === 'BUTTON') return showOsd();
    e.preventDefault();
    v.paused ? v.play() : v.pause();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    v.currentTime = Math.max(0, v.currentTime - 10);
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    v.currentTime += 10;
  }
  showOsd(); // qualunque tasto mostra i controlli
  showCtl();
});

// col telecomando come mouse: muoverlo riporta i bottoni. Il puntatore VIDAA pero
// vibra di qualche pixel da fermo, e senza filtro i bottoni non si nasconderebbero mai.
let ptr = { x: 0, y: 0 };
$('#player').addEventListener('mousemove', (e) => {
  if (!playing) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (dx * dx + dy * dy < 225) return; // meno di 15 px: rumore del puntatore
  ptr = { x: e.clientX, y: e.clientY };
  showCtl();
});

$('#video').addEventListener('timeupdate', (e) => {
  const v = e.target;
  $('#fill').style.width = (v.duration ? (v.currentTime / v.duration) * 100 : 0) + '%';
  $('#ptime').textContent = `${fmt(v.currentTime)} / ${fmt(v.duration)}`;
});
$('#video').addEventListener('error', () => {
  if (!playing) return;
  const m = $('#msg');
  if (m.style.display === 'grid') return; // hls.js ha già spiegato l'errore
  m.textContent = playing.local
    ? 'Impossibile riprodurre il file (download incompleto?)'
    : 'Streaming non disponibile';
  m.style.display = 'grid';
});

// fine episodio: il server segna vista, sposta la finestra e (se attivo) cancella il file
$('#video').addEventListener('ended', async () => {
  const done = playing;
  playing = null;
  stopProgress();
  stopLive();
  if (!done) return;
  try {
    await post('/api/watched', { slug: done.slug, ep: done.ep });
  } catch (e) {
    $('#sinfo').textContent = 'Errore: ' + e.message;
  }
  await loadLibrary().catch(() => {});
  if (current && current.slug === done.slug) {
    applyLocal(library.find((s) => s.slug === done.slug));
    show('series');
    renderSeries();
  } else {
    show('lib');
  }
  setTimeout(focusFirst, 0);
  poll();
});

// Back sulle schermate: una sola funzione, usata dal tasto e dal popstate
function screenBack() {
  const cur = document.querySelector('.screen.on').id;
  if (cur === 'series' && askEp !== null) return closeAsk();
  if (cur === 'search' || cur === 'series') {
    if (cur === 'series') {
      $('#ask').style.display = 'none';
      askEp = null;
      show(backTo === 'search' ? 'search' : 'lib');
      if (backTo !== 'search') loadLibrary();
    } else { show('lib'); loadLibrary(); }
    setTimeout(focusFirst, 0);
  } else {
    window.close(); // VIDAA: il Back in home deve chiudere l'app
  }
}

document.addEventListener('keydown', (e) => {
  if (document.querySelector('#player.on')) return;
  if (!isBack(e)) return;
  if (e.defaultPrevented) return; // già gestito sopra (uscita dal player)
  e.preventDefault(); // nessun Back "di sistema" deve uscire dall'app
  screenBack();
});

// Su VIDAA il tasto indietro del telecomando spesso non arriva come keydown: il
// browser naviga nella storia e chiude l'app. Si tiene un ingresso di storia in
// più e lo si rimette a ogni popstate, gestendo il Back dentro l'app.
history.pushState({ vidaa: 1 }, '');
window.addEventListener('popstate', () => {
  if (document.querySelector('#player.on')) exitPlayer();
  else screenBack();
  history.pushState({ vidaa: 1 }, '');
});

// --- configurazione (serve /config) ---
const ANGOLI = { 'top-left': 'tl', 'top-right': 'tr', 'bottom-left': 'bl', 'bottom-right': 'br' };

function applicaConfig(c) {
  const p = c?.player?.progress;
  if (!p) return;
  const el = $('#prog');
  el.className = ANGOLI[p.corner] || 'bl';
  el.dataset.mode = p.mode || 'bar';
  el.style.display = p.visible ? 'flex' : 'none';
  el.style.opacity = String((p.visible ? Number(p.opacity) : 0) / 100);
  $('#fill').style.background = p.color;
  $('#ptime').style.color = p.color;
}

async function caricaConfig() {
  try { applicaConfig(await api('/api/config')); } catch { /* si tengono i default */ }
}

$('#backbtn').onclick = () => screenBack();
$('#newsbtn').onclick = () => { location.href = '/news?ui=tv'; };

caricaConfig();
loadLibrary().then(focusFirst).catch((e) => {
  $('#libgrid').innerHTML = `<div class="muted">Errore: ${e.message}</div>`;
});

// deep link da /news: /tv?series=slug&ep=3
const qp = new URLSearchParams(location.search);
if (qp.get('series')) {
  (async () => {
    await openSeries(qp.get('series'));
    const n = Number(qp.get('ep'));
    if (!n || !current) return;
    const ep = current.episodes.find((x) => x.n === n);
    if (ep?.ready) play(current.slug, n);
    else playLive(current.slug, n);
  })();
}

poll();

</script>
</body>
